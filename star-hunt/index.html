<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#15120f">
<meta name="color-scheme" content="dark">
<meta name="format-detection" content="telephone=no">
<meta name="description" content="A Christ-centered Christmas scavenger hunt: solve clues, find hidden cards, and follow the Nativity story.">
<title>Follow the Star</title>
<link rel="stylesheet" href="style.css">
<style>
#app { max-width: 560px; margin: 0 auto; padding: calc(env(safe-area-inset-top) + 14px) 16px calc(env(safe-area-inset-bottom) + 28px); }
header { text-align: center; margin-bottom: 16px; }
header h1 { font-size: 22px; margin: 0 0 8px; }
.track { display: flex; justify-content: center; gap: 5px; flex-wrap: wrap; }
.track span { width: 10px; height: 10px; border-radius: 50%; border: 1px solid var(--line); }
.track span.found { border-color: var(--gold); }
.track span.solved { background: var(--gold); border-color: var(--gold); }
.status { font-size: 14px; color: var(--muted); margin-top: 8px; min-height: 20px; }
h2 { font-size: 24px; line-height: 1.25; margin: 0 0 10px; }
.riddle { font: italic 20px/1.55 var(--serif); margin: 0; }
.who { display: flex; justify-content: space-between; align-items: center; gap: 12px; width: 100%; text-align: left;
  background: transparent; color: var(--text); border: 1px solid var(--line); font-weight: 500; }
.who small { color: var(--muted); font-weight: 400; }
.tiles { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
.tiles button { width: auto; margin: 0; min-height: 44px; font-weight: 500; background: transparent; color: var(--text); border: 1px solid var(--line); }
.placed { min-height: 52px; border-bottom: 1px solid var(--line); padding: 10px 2px; margin-top: 8px; font: 18px/1.5 var(--serif); color: var(--gold); }
.feedback { min-height: 22px; margin-top: 8px; font-size: 15px; }
.feedback.bad { color: var(--bad); }
.feedback.good { color: var(--good); }
ul.gifts { margin: 12px 0 0; padding-left: 20px; }
footer { display: flex; justify-content: center; gap: 16px; margin-top: 8px; }
footer button { margin-top: 0; }
</style>
</head>
<body>
<div class="offline" id="offline" hidden>Reconnecting…</div>
<div id="app">
  <header>
    <h1 id="title">Follow the Star</h1>
    <div class="track" id="track" aria-label="Progress"></div>
    <div class="status" id="status"></div>
  </header>
  <main id="main"></main>
  <footer id="footer"></footer>
  <p class="demo" id="demo" hidden>Demo mode: the game only lives in this browser. Add a Firebase address in config.js to play across phones.</p>
</div>
<script src="config.js"></script>
<script src="store.js"></script>
<script src="hunt.js"></script>
<script>
'use strict';
const HUNT = window.HUNT, S = window.StarStore;
const stations = HUNT.stations;
const ME_KEY = 'star-hunt:me:' + S.gameId;
const main = document.getElementById('main');

let myId = readMe();
let view = null;        // a screen shown over the normal flow: message, recap, pin, register
let pending = null;     // a card scanned before signing in
let hintShown = false;
let lastKey = '';
let holding = false;     // keep a finished station on screen until they tap Next

// Remember who is signed in on this phone. In demo mode each browser tab is its own player.
function meStore() { try { return S.mode === 'demo' ? sessionStorage : localStorage; } catch (e) { return null; } }
function readMe() { try { return meStore().getItem(ME_KEY); } catch (e) { return null; } }
function writeMe(id) { myId = id; try { id ? meStore().setItem(ME_KEY, id) : meStore().removeItem(ME_KEY); } catch (e) {} }

const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const norm = s => String(s || '').toUpperCase().replace(/[^A-Z0-9]/g, '');
const byCode = code => stations.findIndex(s => s.code === code);
const meta = () => (S.tree && S.tree.meta) || {};
const started = () => !!meta().startedAt;
const released = () => meta().released || 0;
function me() { return myId ? S.players(S.tree).find(p => p.id === myId) || null : null; }
const lastFound = p => p.found[p.found.length - 1];
const savePlayer = fields => S.update('players/' + myId, fields);

// ---------- cards ----------
function handleCode(raw) {
  const code = norm(raw);
  if (!code) return;
  const p = me();
  if (!p) { pending = code; return show(null); }
  if (!started()) return show({ kind: 'message', title: 'The hunt hasn\'t started yet', text: 'Put the card back where you found it. The MC will start the hunt soon.' });
  if (HUNT.decoys.some(d => d.code === code)) return show({ kind: 'message', title: HUNT.decoyMessage.title, text: HUNT.decoyMessage.text });
  const idx = byCode(code);
  if (idx < 0) return show({ kind: 'message', title: 'That isn\'t one of our cards', text: 'Check the letters and try again.' });
  if (p.found.includes(code)) {
    if (code === lastFound(p) && !p.solved.includes(code)) return show(null);
    return show({ kind: 'recap', idx });
  }
  if (idx === p.found.length) {
    const prev = lastFound(p);
    if (prev && !p.solved.includes(prev)) {
      return show({ kind: 'message', title: 'Almost', text: 'This is the right card, but finish the task at "' + stations[byCode(prev)].title + '" first.' });
    }
    // Saving re-renders straight to the station; don't call show() afterwards or a
    // station with no task (already solved by then) would skip ahead to the next clue.
    hintShown = false; view = null; lastKey = ''; holding = false;
    savePlayer({ found: p.found.concat(code), lastAt: S.SERVER_TIME });
    main.firstElementChild?.classList.add('fade');
    window.scrollTo(0, 0);
    return;
  }
  const line = HUNT.notYet[Math.floor(Math.random() * HUNT.notYet.length)];
  show({ kind: 'message', title: line, text: 'Put this card back where you found it, and keep following your clue.' });
}

function readHash() {
  const params = new URLSearchParams(location.hash.slice(1));
  if (!params.has('s')) return;
  history.replaceState(null, '', location.href.split('#')[0]);
  handleCode(params.get('s'));
}

// ---------- rendering ----------
function show(v, fresh) { view = v; lastKey = ''; holding = false; render(fresh); window.scrollTo(0, 0); }

// Re-render the main area only when something this player sees has changed, so other
// players' moves don't wipe a half-finished puzzle.
function render(fresh) {
  const p = me();
  if (myId && S.tree && !p && !(view && view.kind === 'register')) writeMe(null);
  renderHeader(p);
  if (holding && !view) return;
  let key, html;
  if (!S.tree) { key = 'loading'; html = '<p class="muted" style="text-align:center">Loading…</p>'; }
  else if (view) { key = JSON.stringify(view); html = viewHtml(view, p); }
  else if (!p) { key = 'welcome:' + S.players(S.tree).map(x => x.id + x.name).join(); html = welcomeView(); }
  else if (!started()) { key = 'waiting:' + p.name; html = waitingView(p); }
  else {
    const last = lastFound(p);
    if (last && !p.solved.includes(last)) { key = 'station:' + last; html = stationView(byCode(last), false); }
    else if (p.solved.length === stations.length) { key = 'done:' + p.gifts.join('|'); html = doneView(p); }
    else { const i = p.found.length; key = 'clue:' + i + ':' + (i < released()) + ':' + hintShown; html = clueView(i); }
  }
  if (key === lastKey) return;
  lastKey = key;
  main.innerHTML = html;
  if (fresh) main.firstElementChild?.classList.add('fade');
  loadArt();
  mountChallenge(p);
  renderFooter(p);
  if (p && pending && started()) { const c = pending; pending = null; handleCode(c); }
}

function renderHeader(p) {
  document.getElementById('track').innerHTML = p ? stations.map(s =>
    '<span class="' + (p.solved.includes(s.code) ? 'solved' : p.found.includes(s.code) ? 'found' : '') + '"></span>').join('') : '';
  let status = '';
  if (p) {
    status = esc(p.name);
    if (started()) {
      const order = S.standings(S.tree);
      status += ' · ' + (p.finishedAt ? 'finished ' : '') + S.ordinal(order.findIndex(x => x.id === p.id) + 1) + ' of ' + order.length;
    }
  }
  document.getElementById('status').innerHTML = status;
}

function renderFooter(p) {
  document.getElementById('footer').innerHTML = p && !view ? '<button class="link" data-act="signout">Switch player</button>' : '';
}

function viewHtml(v, p) {
  if (v.kind === 'message') return '<div class="card" style="text-align:center"><h2>' + esc(v.title) + '</h2><p>' + esc(v.text) + '</p></div>' +
    '<button class="ghost" data-act="back">Back to your clue</button>';
  if (v.kind === 'recap') return stationView(v.idx, true);
  if (v.kind === 'pin') return pinView(v);
  if (v.kind === 'register') return registerView(v);
  return '';
}

function welcomeView() {
  const list = S.players(S.tree).sort((a, b) => a.name.localeCompare(b.name));
  return '<div class="card"><p class="eyebrow">' + esc(HUNT.title) + '</p><h2>Who\'s playing?</h2>' +
    (pending ? '<p>Sign in to use the card you just scanned.</p>' : '<p>' + esc(HUNT.intro) + '</p>') +
    (list.length ? list.map(x => '<button class="who" data-act="pick" data-id="' + esc(x.id) + '"><span>' + esc(x.name) +
      (x.team && x.members.length ? '<br><small>' + esc(x.members.join(', ')) + '</small>' : '') + '</span><small>' + (x.team ? 'Team' : '') + '</small></button>').join('') : '') +
    '</div>' +
    '<button data-act="register" data-team="0">I\'m new: play on my own</button>' +
    '<button class="ghost" data-act="register" data-team="1">We\'re new: make a team</button>';
}

function pinView(v) {
  const x = S.players(S.tree).find(p => p.id === v.id);
  if (!x) return welcomeView();
  return '<div class="card"><h2>' + esc(x.name) + '</h2><p>Enter your 4-digit PIN.</p>' +
    '<form class="row" data-form="signin"><input class="pin" name="pin" inputmode="numeric" maxlength="4" autocomplete="off" aria-label="PIN" autofocus>' +
    '<button type="submit">Go</button></form><div class="feedback bad" id="fb"></div>' +
    '<p class="small muted" style="margin-top:10px">Forgot it? Ask the MC to reset your PIN.</p></div>' +
    '<button class="ghost" data-act="back">Back</button>';
}

function registerView(v) {
  return '<div class="card"><h2>' + (v.team ? 'Make a team' : 'New player') + '</h2>' +
    '<form data-form="register">' +
    '<label class="field">' + (v.team ? 'Team name' : 'Your name') + '<input name="name" maxlength="30" autocomplete="off" required placeholder="' + (v.team ? 'Mom & Ellie' : 'Ryan') + '"></label>' +
    (v.team ? '<label class="field">Who\'s on the team? (separate names with commas)<input name="members" maxlength="80" autocomplete="off" placeholder="Mom, Ellie"></label>' : '') +
    '<label class="field">Choose a 4-digit PIN' + (v.team ? ' for the team' : '') + '<input class="pin" name="pin" inputmode="numeric" maxlength="4" autocomplete="off" required></label>' +
    '<p class="small muted" style="margin-top:8px">You\'ll need it to get back in on another phone or later tonight.</p>' +
    '<div class="feedback bad" id="fb"></div>' +
    '<button type="submit">' + (v.team ? 'Make our team' : 'Join the hunt') + '</button></form></div>' +
    '<button class="ghost" data-act="back">Back</button>';
}

function waitingView(p) {
  const n = S.players(S.tree).length;
  return '<div class="card" style="text-align:center"><p class="eyebrow">You\'re in</p><h2>' + esc(p.name) + '</h2>' +
    '<p>Waiting for the MC to start the hunt. ' + n + (n === 1 ? ' player has' : ' players have') + ' joined so far.</p>' +
    '<p class="muted small">Keep this page open. Your first clue will appear here.</p></div>';
}

function clueView(i) {
  const s = stations[i];
  const open = i < released()
    ? '<div class="notice"><p class="eyebrow">Opened by the MC</p><p>The card for this clue was hidden here: ' + esc(s.hide) + '</p>' +
      '<p class="code-big">' + esc(s.code) + '</p><button data-act="use" data-code="' + esc(s.code) + '">Use this code</button></div>'
    : '';
  return open + '<div class="card">' +
    '<p class="eyebrow">Clue ' + (i + 1) + ' of ' + stations.length + '</p>' +
    '<p class="riddle">' + esc(s.clue) + '</p>' +
    '<p class="small muted" style="margin-top:12px">For little ones: ' + esc(s.kids) + '</p>' +
    (hintShown ? '<p class="small" style="color:var(--gold)">Hint: ' + esc(s.hint) + '</p>' : '<button class="ghost" data-act="hint">Need a hint?</button>') +
    '</div>' +
    '<div class="card"><p>Found the card? Scan it with your phone\'s camera, or type the code printed under it.</p>' +
    '<form class="row" data-form="code"><input class="code" name="code" maxlength="8" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="CODE" aria-label="Card code">' +
    '<button type="submit">Go</button></form></div>';
}

function verses(s) {
  return s.scriptures.map(v =>
    '<div class="verse' + (v.bom ? ' bom' : '') + '"><q>' + esc(v.text) + '</q>' +
    '<span class="ref">' + esc(v.ref) + (v.bom ? '<span class="chip">Book of Mormon</span>' : '') + '</span></div>').join('');
}

function artHtml(s) {
  if (!s.art) return '';
  return '<figure class="art" hidden data-wiki="' + esc(s.art.wiki || '') + '" data-src="' + esc(s.art.src || '') + '">' +
    '<img alt="' + esc(s.art.credit) + '"><figcaption>' + esc(s.art.credit) + '</figcaption></figure>';
}

function stationView(i, recap) {
  const s = stations[i];
  const last = i === stations.length - 1;
  return '<div class="card">' + artHtml(s) +
    '<p class="eyebrow">' + (recap ? 'Already found · ' : 'Card ') + (i + 1) + ' of ' + stations.length + '</p>' +
    '<h2>' + esc(s.title) + '</h2>' +
    '<p>' + esc(s.story) + '</p>' + verses(s) +
    '<div class="ponder">' + esc(s.ponder) + '</div></div>' +
    (recap
      ? '<button class="ghost" data-act="back">Back to your clue</button>'
      : '<div class="card" id="challenge"></div>' +
        '<button id="next" data-act="next" hidden>' + (last ? 'Finish' : 'Show the next clue') + '</button>');
}

function doneView(p) {
  const order = S.standings(S.tree);
  const place = order.findIndex(x => x.id === p.id) + 1;
  return '<div class="card" style="text-align:center">' + artHtml(stations[stations.length - 1]) +
    '<p class="eyebrow">You finished ' + S.ordinal(place) + '</p>' +
    '<h2>Glory to God in the highest</h2>' +
    '<p>You followed the star all the way to the manger. Wait here for the others, and then read Luke 2 together.</p>' +
    '<div class="verse" style="text-align:left"><q>For unto you is born this day in the city of David a Saviour, which is Christ the Lord.</q><span class="ref">Luke 2:11</span></div>' +
    (p.gifts.length ? '<div style="text-align:left"><p class="eyebrow" style="margin-top:18px">Your gifts for Him</p><ul class="gifts">' +
      p.gifts.map(g => '<li>' + esc(g) + '</li>').join('') + '</ul></div>' : '') + '</div>';
}

// Pictures come from Wikipedia articles (public-domain paintings and free photos).
const artCache = {};
function wikiImage(title) {
  if (!artCache[title]) {
    artCache[title] = fetch('https://en.wikipedia.org/api/rest_v1/page/summary/' + encodeURIComponent(title))
      .then(r => (r.ok ? r.json() : null))
      .then(j => {
        const t = j && (j.thumbnail || j.originalimage);
        if (!t) return null;
        // Ask for a phone-sized copy instead of the full-resolution original.
        return /\/\d+px-/.test(t.source) ? t.source.replace(/\/\d+px-/, '/1000px-') : t.source;
      })
      .catch(() => null);
  }
  return artCache[title];
}
function loadArt() {
  main.querySelectorAll('figure.art').forEach(fig => {
    const img = fig.querySelector('img');
    img.onload = () => { fig.hidden = false; };
    img.onerror = () => { fig.remove(); };
    if (fig.dataset.src) img.src = fig.dataset.src;
    else if (fig.dataset.wiki) wikiImage(fig.dataset.wiki).then(src => { if (src) img.src = src; else fig.remove(); });
  });
}

// ---------- challenges ----------
function mountChallenge(p) {
  const box = document.getElementById('challenge');
  if (!box || !p) return;
  const s = stations[byCode(lastFound(p))];
  const c = s.challenge;
  const done = () => {
    const cur = me();
    if (cur.solved.includes(s.code)) return;
    const solved = cur.solved.concat(s.code);
    const fields = { solved, lastAt: S.SERVER_TIME };
    if (solved.length === stations.length) fields.finishedAt = S.SERVER_TIME;
    document.getElementById('next').hidden = false;
    holding = true;
    savePlayer(fields);
  };
  if (!c) { box.remove(); done(); return; }
  box.innerHTML = '<p class="eyebrow">Together</p><p>' + esc(c.prompt) + '</p><div id="ch"></div><div class="feedback" id="cfb"></div>';
  const ch = box.querySelector('#ch'), fb = box.querySelector('#cfb');
  const win = msg => { fb.className = 'feedback good'; fb.textContent = msg; done(); };

  if (c.type === 'order') {
    const items = c.items.map((t, i) => ({ t, i }));
    do { shuffle(items); } while (c.items.length > 1 && items.every((x, k) => x.i === k));
    let next = 0;
    ch.innerHTML = '<div class="placed" id="placed"></div><div class="tiles">' +
      items.map(x => '<button data-i="' + x.i + '">' + esc(x.t) + '</button>').join('') + '</div>';
    const placed = ch.querySelector('#placed');
    ch.querySelectorAll('.tiles button').forEach(b => b.addEventListener('click', () => {
      if (+b.dataset.i === next) {
        b.remove(); placed.textContent += (next ? ' ' : '') + c.items[next]; next++;
        fb.textContent = '';
        if (next === c.items.length) win('That\'s it.');
      } else {
        fb.className = 'feedback bad'; fb.textContent = 'Not that one yet. Look at the scripture above.';
      }
    }));
  } else if (c.type === 'word') {
    ch.innerHTML = '<form class="row" data-form="word"><input name="w" autocomplete="off" aria-label="Answer"><button type="submit">Check</button></form>';
    ch.querySelector('form').addEventListener('submit', e => {
      e.preventDefault();
      const input = e.target.w, guess = input.value.toLowerCase().replace(/[^a-z0-9]/g, '');
      if (c.answers.some(a => a.toLowerCase() === guess)) { input.disabled = true; e.target.querySelector('button').remove(); win('Yes.'); }
      else { fb.className = 'feedback bad'; fb.textContent = 'Not quite. The scriptures above can help.'; }
    });
  } else if (c.type === 'together') {
    ch.innerHTML = '<button class="ghost">' + esc(c.button) + '</button>';
    ch.querySelector('button').addEventListener('click', e => { e.target.remove(); win('Thank you.'); });
  } else if (c.type === 'gifts') {
    ch.innerHTML = '<form class="row" data-form="gift"><input name="g" maxlength="80" autocomplete="off" placeholder="My gift to Him…" aria-label="Gift"><button type="submit">Add</button></form>' +
      '<ul class="gifts" id="giftlist"></ul><button class="ghost" id="giftsdone" disabled>We\'ve added our gifts</button>';
    const list = ch.querySelector('#giftlist'), fin = ch.querySelector('#giftsdone');
    let gifts = me().gifts.slice();
    const draw = () => { list.innerHTML = gifts.map(g => '<li>' + esc(g) + '</li>').join(''); fin.disabled = !gifts.length; };
    draw();
    ch.querySelector('form').addEventListener('submit', e => {
      e.preventDefault();
      const g = e.target.g.value.trim();
      if (g) { gifts = gifts.concat(g); savePlayer({ gifts }); e.target.g.value = ''; draw(); }
    });
    fin.addEventListener('click', () => { fin.remove(); ch.querySelector('form').remove(); win('He will treasure them.'); });
  }
}

function shuffle(a) {
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}

// ---------- sign in and register ----------
let wrongPins = 0, lockedUntil = 0;
async function signIn(form) {
  const fb = document.getElementById('fb');
  const pin = form.pin.value.trim();
  if (Date.now() < lockedUntil) { fb.textContent = 'Too many tries. Wait a moment.'; return; }
  const x = S.players(S.tree).find(p => p.id === view.id);
  if (!x) return show(null);
  if (await S.hashPin(x.id, pin) === x.pinHash) {
    wrongPins = 0; writeMe(x.id); show(null, true);
  } else {
    wrongPins++;
    if (wrongPins >= 5) { lockedUntil = Date.now() + 30000; wrongPins = 0; }
    fb.textContent = 'That PIN isn\'t right.';
    form.pin.value = '';
  }
}

async function register(form) {
  const fb = document.getElementById('fb');
  const name = form.name.value.trim().replace(/\s+/g, ' ');
  const pin = form.pin.value.trim();
  if (!name) { fb.textContent = 'Please enter a name.'; return; }
  if (!/^\d{4}$/.test(pin)) { fb.textContent = 'The PIN needs to be 4 numbers.'; return; }
  if (S.players(S.tree).some(p => p.name.toLowerCase() === name.toLowerCase())) { fb.textContent = 'Someone already has that name. Try another.'; return; }
  const id = S.uid();
  const members = view.team ? (form.members.value || '').split(',').map(m => m.trim()).filter(Boolean) : [];
  writeMe(id);
  await S.set('players/' + id, {
    name, team: !!view.team, members, pinHash: await S.hashPin(id, pin), createdAt: S.SERVER_TIME,
  });
  show(null, true);
}

// ---------- events ----------
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el) return;
  const act = el.dataset.act;
  if (act === 'hint') { hintShown = true; render(); }
  else if (act === 'back' || act === 'next') { if (act === 'next') hintShown = false; show(null, act === 'next'); }
  else if (act === 'pick') show({ kind: 'pin', id: el.dataset.id });
  else if (act === 'register') show({ kind: 'register', team: el.dataset.team === '1' });
  else if (act === 'use') handleCode(el.dataset.code);
  else if (act === 'signout') { writeMe(null); show(null); }
});
document.addEventListener('submit', e => {
  const kind = e.target.dataset.form;
  if (!['code', 'signin', 'register'].includes(kind)) return;
  e.preventDefault();
  if (kind === 'code') handleCode(e.target.code.value);
  if (kind === 'signin') signIn(e.target);
  if (kind === 'register') register(e.target);
});
window.addEventListener('hashchange', readHash);
window.addEventListener('star-store-error', () => {
  document.getElementById('offline').hidden = false;
  document.getElementById('offline').textContent = 'Couldn\'t save. Check your connection.';
});

document.getElementById('title').textContent = HUNT.title;
document.getElementById('demo').hidden = S.mode !== 'demo';
S.subscribe((tree, connected) => {
  document.getElementById('offline').hidden = connected;
  render();
});
render();
readHash();
</script>
</body>
</html>
