<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0b0a09">
<meta name="format-detection" content="telephone=no">
<meta name="description" content="For Unto Us: a Christmas hunt through Isaiah 9:6. Solve each clue, find the hidden card, and write the verse one phrase at a time.">
<title>For Unto Us</title>
<link rel="preload" href="fonts/inter-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/cormorant-garamond-latin-500-normal.woff2" as="font" type="font/woff2" crossorigin>
<!-- 1. version.js always loads fresh; 2. everything else loads with ?v=<build> -->
<script>document.write('<script src="version.js?t=' + Date.now() + '"><\/script>');</script>
<script>
StarHuntLoad(['css/tokens.css', 'css/base.css', 'css/player.css',
  'config.js', 'hunt.sealed.js', 'seal.js', 'store.js']);
document.write('<link rel="icon" type="image/svg+xml" href="' + StarHuntAsset('img/star.svg') + '">');
</script>
</head>
<body>
<div class="offline" id="offline" role="status" hidden>Reconnecting…</div>
<div class="paused-bar" id="paused-bar" role="status" hidden><b>The hunt is paused.</b> Please wait for the MC.</div>
<main id="app"></main>
<noscript><p class="center-note">This hunt needs JavaScript. Please turn it on and reload the page.</p></noscript>
<script>
'use strict';
(function () {
  const app = document.getElementById('app');
  const offlineBar = document.getElementById('offline');
  const pausedBar = document.getElementById('paused-bar');
  const S = window.StarStore, H = window.HuntSeal;
  const HUNT = H && H.hunt && H.hunt.stationCount ? H.hunt : null;   // public fields only
  const N = HUNT ? HUNT.stationCount : 0;
  const PHRASES = HUNT ? HUNT.phrases : [];
  const REF = (HUNT && HUNT.verse && HUNT.verse.ref) || 'Isaiah 9:6';
  const DEMO = !!S && S.mode === 'demo';

  // ---------- small helpers ----------
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  // Hunt content is typed with straight quotes; show typographic ones (“ ” ‘ ’).
  const smart = s => String(s == null ? '' : s)
    .replace(/(^|[\s([{\u2013\u2014])"/g, '$1\u201C').replace(/"/g, '\u201D')
    .replace(/(^|[\s([{\u2013\u2014])'/g, '$1\u2018').replace(/'/g, '\u2019');
  const nowrap = html => '<span class="nowrap">' + html + '</span>';
  // Scripture references never break inside: "3 Nephi 9:15", "(Matthew 2:8, 12–13)", "Isaiah 9:6–7".
  const REF_RE = /\b(?:[1-4] )?[A-Z][a-z]+ \d+:\d+(?:[–-]\d+)?(?:, ?\d+(?:[–-]\d+)?)*/g;
  // Content text: escaped, with typographic quotes and unbreakable references.
  const tx = s => {
    const t = smart(s);
    let out = '', at = 0;
    t.replace(REF_RE, (m, i) => { out += esc(t.slice(at, i)) + nowrap(esc(m)); at = i + m.length; return m; });
    return out + esc(t.slice(at));
  };
  const $ = sel => app.querySelector(sel);
  const ordinal = n => (S ? S.ordinal(n) : String(n));
  function storage(name) { try { return window[name] || null; } catch (e) { return null; } }
  function sget(st, k) { try { return st ? st.getItem(k) : null; } catch (e) { return null; } }
  function sset(st, k, v) { try { if (st) { if (v == null) st.removeItem(k); else st.setItem(k, v); } } catch (e) {} }

  const gameId = S ? S.gameId : 'x';
  const ME_KEY = 'star-hunt:me:' + gameId;
  const PENDING_KEY = 'star-hunt:pending:' + gameId;
  const LOCK_KEY = 'star-hunt:pin-lock:' + gameId;
  // Who is signed in on this phone. In demo mode each browser tab is its own player.
  const meStore = () => storage(DEMO ? 'sessionStorage' : 'localStorage');

  // ---------- state ----------
  let myId = S ? sget(meStore(), ME_KEY) : null;
  let view = null;      // a screen over the normal flow: register, pin, message, recap, checking
  let pending = sget(storage('sessionStorage'), PENDING_KEY);   // a card scanned before signing in
  let holdCode = null;  // keep a just-finished station on screen until they tap "Show the next clue"
  let fatal = null;     // an environment problem from HuntSeal (no crypto.subtle, no hunt file)
  let busy = null;      // the card code being checked right now
  let seq = 0;          // makes every message view a fresh screen
  let cur = { key: null };
  let station = null;   // the mounted station screen's task state { code, done }
  let hadTree = false, saveErrorUntil = 0;
  const bootAt = Date.now();

  const me = () => (myId && S && S.tree ? S.player(S.tree, myId) : null);
  function writeMe(id) { myId = id || null; sset(meStore(), ME_KEY, myId); }
  function setPending(code) { pending = code || null; sset(storage('sessionStorage'), PENDING_KEY, pending); }

  // ---------- opening sealed content (cached; nothing secret is fetched until it is earned) ----------
  const entries = new Map();   // card code -> station/decoy entry, or null
  const riddles = new Map();   // 'start:<key>' -> clue 1 text, or null
  const inflight = new Set();
  function want(map, key, load) {
    if (map.has(key)) return map.get(key);
    if (!inflight.has(key)) {
      inflight.add(key);
      Promise.resolve().then(load)
        .then(v => { map.set(key, v); }, err => { fatal = err || new Error('open failed'); })
        .then(() => { inflight.delete(key); render(); });
    }
    return undefined;   // still opening
  }
  const entryFor = code => want(entries, code, () => H.openCard(code));
  // The riddle for clue n: clue 1 opens with the MC's start key, every later clue comes from the previous card.
  function riddleFor(t, prog) {
    if (prog.n === 1) {
      const k = S.startKey(t);
      if (!k) return null;
      return want(riddles, 'start:' + k, () => H.openStart(k).then(r => (r && r.clue) || null));
    }
    const e = entryFor(prog.prevCode);
    if (e === undefined) return undefined;
    return (e && e.nextClue) || null;
  }

  // ---------- shared markup ----------
  const CHEV = '<svg class="chev" width="8" height="14" viewBox="0 0 8 14" fill="none" aria-hidden="true"><path d="M1 1l6 6-6 6" stroke="currentColor" stroke-width="1.4"/></svg>';
  const demoNote = () => (DEMO ? '<p class="demo-note">Demo mode: only screens in this browser are connected.</p>' : '');
  const switchLink = () => '<div class="switch"><button class="btn btn--quiet btn--small-text" type="button" data-act="switch">Not you? Switch player</button></div>';
  const membersLine = p => (p.team && p.members.length ? '<p class="members">' + esc(p.members.join(', ')) + '</p>' : '');

  // ---------- pause and end (the store's helpers; a plain reading of meta if this store predates them) ----------
  const metaOf = t => (t && S.meta(t)) || {};
  const isPaused = t => !!t && (typeof S.isPaused === 'function' ? !!S.isPaused(t) : !!metaOf(t).paused);
  const isEnded = t => !!t && (typeof S.isEnded === 'function' ? !!S.isEnded(t) : !!metaOf(t).ended);
  const revealAt = t => (!t ? null : typeof S.revealAt === 'function' ? S.revealAt(t) || null : (metaOf(t).reveal || {}).at || null);
  // The results order: finishers by finish time, then everyone else by the race order.
  function finalStandings(t) {
    if (typeof S.finalStandings === 'function') return S.finalStandings(t) || [];
    return S.standings(t).map((p, i) => ({ id: p.id, place: i + 1, name: p.name, members: p.members, team: p.team, solved: p.solved.length, finishedAt: p.finishedAt || null }));
  }
  const solvedCount = e => Math.min(N, typeof e.solved === 'number' ? e.solved : Array.isArray(e.solved) ? e.solved.length : +e.solvedCount || 0);
  const PAUSED_MSG = 'The hunt is paused. Please wait for the MC.';
  const ENDED_MSG = 'The hunt has ended. Look at the TV.';
  // Why nobody can make progress right now ('' when they can). The end wins over a pause.
  const blockedMsg = t => (isEnded(t) ? ENDED_MSG : isPaused(t) ? PAUSED_MSG : '');
  // A task step tried while paused (a tap that beat the screen): say why, and change nothing.
  function refuseTask(fb) {
    const why = blockedMsg(S.tree);
    if (!why) return false;
    setFb(fb, '', why);
    return true;
  }

  function placeHtml(t, p) {
    if (!p || !S.started(t)) return '';
    const place = S.place(t, p.id);
    if (!place) return '';
    return p.finishedAt
      ? '<span class="sr-only">Your place: </span>Finished <b>' + ordinal(place) + '</b>'
      : '<span class="sr-only">Your place: </span><b>' + ordinal(place) + '</b> of ' + S.players(t).length;
  }
  function appbar(t, p) {
    return '<header class="appbar"><span class="appbar-name">' + esc(p.name) + '</span><span class="appbar-place" id="place">' + placeHtml(t, p) + '</span></header>';
  }
  function backbar(t, p, label) {
    return '<header class="appbar appbar--back"><button class="appbar-back" type="button" data-act="back"><span class="chev" aria-hidden="true">‹</span> ' + esc(label) +
      '</button><span class="appbar-place" id="place">' + placeHtml(t, p) + '</span></header>';
  }
  function backLabel(t, p) {
    if (!p || !S.started(t)) return 'Back';
    const prog = S.progress(p, N);
    if (holdCode || prog.stage === 'station') return 'Back to your station';
    return prog.stage === 'clue' ? 'Back to your clue' : 'Back';
  }

  // The verse on the wall: written phrases in ink, the newest in gilt, the next one ghosted and underlined.
  // Short phrases (the names of Christ) never break inside: not "The everlasting / Father,".
  const phCls = (ph, more) => 'ph' + (ph.length <= 24 ? ' nb' : '') + (more ? ' ' + more : '');
  // `over`: the hunt has ended, so there is no next phrase to point to.
  function wallHtml(written, after, over) {
    const spans = PHRASES.map((ph, i) => {
      if (i < written) return '<span class="' + phCls(ph, i === written - 1 ? 'is-newest' : '') + '">' + esc(ph) + '</span>';
      if (i === written && !over) return '<span class="' + phCls(ph, 'is-next') + '"><u>' + esc(ph) + '</u></span>';
      return '<span class="' + phCls(ph, 'is-open') + '">' + esc(ph) + '</span>';
    }).join(' ');
    const sr = written === 0
      ? 'Tonight you will write ' + REF + ', one phrase at a time. First: ' + PHRASES[0]
      : 'Your verse so far: ' + PHRASES.slice(0, written).join(' ') + (written < N && !over ? ' Next: ' + PHRASES[written] : '');
    return '<section class="wall" aria-labelledby="wall-h">' +
      '<div class="wall-head"><span class="label label--gilt" id="wall-h">' + esc(REF) + '</span><span class="label">' + written + ' of ' + N + ' written</span></div>' +
      '<p class="wall-verse" aria-hidden="true">' + spans + '</p><p class="sr-only">' + esc(sr) + '</p>' + (after || '') + '</section>';
  }
  function ticksHtml(state) {   // state(i) -> '' | 'on' | 'now'
    let s = '';
    for (let i = 0; i < N; i++) { const c = state(i); s += c ? '<i class="' + c + '"></i>' : '<i></i>'; }
    return '<div class="ticks" style="--n:' + N + '" aria-hidden="true">' + s + '</div>';
  }
  const lenClass = ph => (ph.length <= 16 ? 's' : ph.length <= 30 ? 'm' : ph.length <= 80 ? 'l' : 'xl');
  function earnedHtml(n, label, ticks) {
    const phrase = PHRASES[n - 1] || '';
    const prev = n > 1 ? PHRASES[n - 2] : '';
    return '<section class="earned" aria-label="' + (label === 'Added to your verse' ? 'Phrase added to your verse' : 'Phrase already in your verse') + '">' +
      '<div class="earned-head"><span class="label label--gilt">' + label + '</span><span class="label">' + n + ' of ' + N + '</span></div>' +
      (prev ? '<p class="earned-ctx">' + (n > 2 ? '…' : '') + esc(prev) + '</p>' : '') +
      '<p class="earned-phrase" data-len="' + lenClass(phrase) + '">' + esc(phrase) + '</p>' + ticks + '</section>';
  }
  // The credit line under a painting ("Bible Videos · Courtesy of The Church of Jesus Christ of Latter-day Saints").
  // A credit that starts with the painting's title again ("Title (Bible Videos) · Courtesy of …") loses it: the
  // work line above already shows the title. The Church's name never breaks, and "·" never starts a line.
  function creditHtml(a) {
    let c = smart(a && a.credit).trim();
    const title = smart(a && a.title).trim();
    if (title && c.indexOf(title) === 0) c = c.slice(title.length).trim().replace(/^\(([^()]*)\)/, '$1').replace(/^[\s,·–—-]+/, '');
    return tx(c).replace(/ · /g, ' · ').replace(/Latter-day Saints/g, nowrap('Latter-day Saints'));
  }
  // A painting, never cropped. If the file is missing, the figure and its label quietly go away.
  function plateHtml(art) {
    if (!art || !art.src) return '';
    const w = +art.w || 0, h = +art.h || 0;
    const portrait = w && h && h / w > 1.15;
    const work = [art.artist ? tx(art.artist) : '', art.title ? '<i>' + tx(art.title) + '</i>' : '', art.year ? esc(art.year) : ''].filter(Boolean).join(', ');
    const credit = creditHtml(art);
    return '<figure class="plate' + (portrait ? ' plate--portrait' : '') + '"><img src="' + esc(StarHuntAsset(art.src)) + '"' +
      (w && h ? ' width="' + w + '" height="' + h + '"' : '') + ' alt="' + esc(art.alt || '') + '" decoding="async" onerror="artFail(this)"></figure>' +
      (work || credit ? '<div class="object-label">' + (work ? '<span class="work">' + work + '</span>' : '') +
        (credit ? '<span class="credit">' + credit + '</span>' : '') + '</div>' : '');
  }
  window.artFail = function (img) {
    const fig = img.closest('figure');
    if (!fig) return;
    if (fig.classList.contains('cover')) {
      fig.classList.add('cover--bare'); img.remove();
      const credit = app.querySelector('.cover-credit');
      if (credit) credit.remove();
      return;
    }
    const label = fig.nextElementSibling;
    if (label && label.classList.contains('object-label')) label.remove();
    fig.remove();
  };
  const scriptureHtml = x => '<figure class="scripture scripture--' + (x.bom ? 'bom' : 'bible') + '"><figcaption class="vol">' + (x.bom ? 'The Book of Mormon' : 'The Holy Bible') +
    '</figcaption><blockquote>' + tx(x.text) + '</blockquote><cite>' + esc(x.ref) + '</cite></figure>';
  function scripturesHtml(list) {
    if (!list || !list.length) return '';
    return '<div class="scriptures">' + list.map(scriptureHtml).join('') + '</div>';
  }
  const giftsList = gifts => '<ul class="gifts">' + gifts.map(g => '<li>' + esc(g) + '</li>').join('') + '</ul>';
  // Store writes apply on this phone at once and resolve when saved (a failed save raises 'star-store-error').
  // A refusal (err.code, e.g. 'no-player' after the MC removed this player) means our copy was out of date:
  // draw the screen again from the current game.
  function settle(pr) {
    if (pr && typeof pr.catch === 'function') pr.catch(err => { if (err && err.code) render(); });
    return pr;
  }
  function setFb(el, tone, text) {
    if (!el) return;
    el.className = 'feedback' + (tone ? ' is-' + tone : '');
    el.textContent = text || '';
  }

  // ---------- screens ----------
  // Each screen: { key, cls, html(), mount(), update() }. A screen is rebuilt only when its key changes;
  // otherwise update() touches just the live parts, so typing and half-done tasks are never wiped.

  function loadingScreen() {
    const slow = !DEMO && Date.now() - bootAt > 6000;
    return {
      key: 'loading:' + slow,
      html: () => '<p class="loading-note" role="status">' + (slow ? 'Still connecting… Check your Wi-Fi.' : 'Opening the hunt…') + '</p>',
    };
  }

  function problemScreen(kind) {
    const p = me();
    const copy = {
      'insecure-context': ['Can’t open the hunt here', 'This page needs its secure address', 'Open the hunt from its https:// link or scan the code on the TV, then try again.'],
      'no-hunt': ['The hunt didn’t load', 'Something didn’t finish loading', 'Reload the page to try again. If it keeps happening, ask the MC.'],
      stale: ['Check with the MC', 'This card no longer opens', 'The hunt was changed after you found this card. Ask the MC to clear your progress, then start again.'],
      other: ['Something went wrong', 'The hunt couldn’t open', 'Reload the page to try again. If it keeps happening, ask the MC.'],
    }[kind] || [];
    return {
      key: 'problem:' + kind,
      html: () => (p && S.tree ? appbar(S.tree, p) : '') +
        '<section class="section section--message"><p class="label">' + copy[0] + '</p><h1 class="h-page">' + copy[1] + '</h1><p class="text">' + copy[2] + '</p></section>' +
        '<div class="actions"><button class="btn btn--primary btn--block" type="button" data-act="reload">Reload</button></div>' +
        (p ? switchLink() : '') + demoNote(),
    };
  }

  // Welcome: who's playing?
  let welcomeShown = { roster: '', pending: false };   // what the mounted welcome screen shows (kept out of the DOM)
  function rosterSig(t) { return JSON.stringify(S.players(t).map(p => [p.id, p.name, p.team, p.members])); }
  function rosterHtml(t) {
    const list = S.players(t).sort((a, b) => a.name.localeCompare(b.name, undefined, { sensitivity: 'base' }));
    if (!list.length) return '<li class="roster-empty">Nobody yet. Be the first to sign up.</li>';
    return list.map(x => '<li><button class="roster-row" type="button" data-act="pick" data-id="' + esc(x.id) + '">' +
      '<span><span class="name">' + esc(x.name) + '</span>' + (x.team && x.members.length ? '<span class="members">' + esc(x.members.join(', ')) + '</span>' : '') + '</span>' +
      '<span class="kind">' + (x.team ? 'Team' : 'Solo') + '</span>' + CHEV + '</button></li>').join('');
  }
  const pendingHtml = () => (pending
    ? '<section class="notice fade-in" aria-labelledby="pend-h"><p class="label" id="pend-h">Card scanned</p><p>Sign in or sign up to use the card you just scanned.</p></section>' : '');
  // The fixed join bar must never cover the last roster row: the welcome screen's bottom padding follows the
  // bar's real height (it grows with large text, zoom and the phone's safe area). See #app.app--welcome in player.css.
  let barWatch = null;
  function watchJoinbar() {
    const bar = $('.joinbar');
    if (!bar) return;
    const fit = () => document.documentElement.style.setProperty('--joinbar-h', Math.ceil(bar.getBoundingClientRect().height) + 'px');
    fit();
    if (window.ResizeObserver) { barWatch = new ResizeObserver(fit); barWatch.observe(bar); }
  }
  function welcomeScreen(t) {
    const c = HUNT.cover;
    const work = c ? [c.artist ? tx(c.artist) : '', c.title ? '<i>' + tx(c.title) + '</i>' : ''].filter(Boolean).join(', ') : '';
    const credit = c ? creditHtml(c) : '';
    const cover = c && c.src
      ? '<figure class="cover"><img src="' + esc(StarHuntAsset(c.src)) + '"' + (c.w && c.h ? ' width="' + c.w + '" height="' + c.h + '"' : '') +
        ' alt="' + esc(c.alt || '') + '" onerror="artFail(this)"><span class="wordmark">' + esc(HUNT.title) + '</span></figure>' +
        (work || credit ? '<p class="cover-credit">' + (work ? '<span class="work">' + work + ' (detail)</span>' : '') +
          (credit ? '<span class="credit">' + credit + '</span>' : '') + '</p>' : '')
      : '<figure class="cover cover--bare"><span class="wordmark">' + esc(HUNT.title) + '</span></figure>';
    return {
      key: 'welcome',
      cls: 'app--welcome',
      html: () => cover +
        '<header class="masthead"><p class="label label--gilt">A Christmas hunt through ' + nowrap(esc(REF)) + '</p>' +
        '<h1 class="h-display">For unto us <em>a child is&nbsp;born</em></h1>' +
        '<p class="intro">Solve each clue, find the hidden card and scan it. Each card writes the next words of ' + nowrap(esc(REF)) + '.</p></header>' +
        '<div id="pending-slot" aria-live="polite">' + pendingHtml() + '</div>' +
        '<div class="roster-head"><h2 class="h-section">Who’s playing?</h2><span class="label" id="joined">' + S.players(t).length + ' joined</span></div>' +
        '<ol class="roster" id="roster">' + rosterHtml(t) + '</ol>' + demoNote() +
        '<section class="joinbar" aria-label="Sign up"><p><b>New tonight?</b> Sign up on your own or as a team.</p>' +
        '<div class="joinbar-actions"><button class="btn btn--primary" type="button" data-act="register" data-team="0">Play solo</button>' +
        '<button class="btn btn--secondary" type="button" data-act="register" data-team="1">Make a team</button></div></section>',
      mount() { welcomeShown = { roster: rosterSig(t), pending: !!pending }; watchJoinbar(); },
      update() {
        const t2 = S.tree, sig = rosterSig(t2);
        if (welcomeShown.roster !== sig) { $('#roster').innerHTML = rosterHtml(t2); welcomeShown.roster = sig; }
        $('#joined').textContent = S.players(t2).length + ' joined';
        if (welcomeShown.pending !== !!pending) { $('#pending-slot').innerHTML = pendingHtml(); welcomeShown.pending = !!pending; }
      },
    };
  }

  function registerScreen(v) {
    const team = !!v.team;
    return {
      key: 'register:' + team,
      html: () => backbar(S.tree, null, 'Back') +
        '<section class="section"><h1 class="h-page">' + (team ? 'Make a team' : 'New player') + '</h1>' +
        '<p class="prompt">' + (team ? 'Name your team and list who’s on it.' : 'Pick a name everyone will recognise.') + '</p>' +
        '<form id="reg-form" novalidate>' +
        '<label class="field-label">' + (team ? 'Team name' : 'Your name') +
          ' <input class="field" name="name" placeholder="' + (team ? 'Mom &amp; Ellie' : 'Ryan') + '" autocomplete="off" autocapitalize="words" maxlength="40" enterkeyhint="next"></label>' +
        (team ? '<label class="field-label">Who’s on the team? <input class="field" name="members" placeholder="Mom, Ellie" autocomplete="off" autocapitalize="words" maxlength="120" enterkeyhint="next" aria-describedby="members-help"></label>' +
          '<p class="help" id="members-help">Separate names with commas</p>' : '') +
        '<label class="field-label">Choose a 4-digit PIN' + (team ? ' for the team' : '') +
          ' <input class="field field--pin" name="pin" type="text" placeholder="····" inputmode="numeric" pattern="[0-9]*" maxlength="4" autocomplete="off" enterkeyhint="done" aria-describedby="pin-help"></label>' +
        '<p class="help" id="pin-help">You’ll need it to sign back in on another phone or later tonight.</p>' +
        '<p class="feedback" id="reg-fb" aria-live="polite"></p>' +
        '<button class="btn btn--primary btn--block" type="submit">' + (team ? 'Make our team' : 'Join the hunt') + '</button></form></section>' + demoNote(),
    };
  }

  function pinScreen(x) {
    return {
      key: 'pin:' + x.id,
      html: () => backbar(S.tree, null, 'Back') +
        '<section class="section section--pin"><p class="label">Welcome back</p><h1 class="h-page">' + esc(x.name) + '</h1>' + membersLine(x) +
        '<p class="prompt" id="pin-prompt">Enter your 4-digit PIN.</p>' +
        '<form class="pin-row" id="pin-form" novalidate><input class="field field--pin" name="pin" type="text" placeholder="····" inputmode="numeric" pattern="[0-9]*" maxlength="4" autocomplete="off" enterkeyhint="go" aria-label="PIN" aria-describedby="pin-prompt pin-fb">' +
        '<button class="btn btn--primary" type="submit">Go</button></form>' +
        '<p class="feedback" id="pin-fb" aria-live="polite"></p>' +
        '<p class="forgot">Forgot it? Ask the MC to reset your PIN.</p></section>' + demoNote(),
      mount() { const lock = pinLock(); if (lock.until > Date.now()) lockPinForm(lock.until); else { const f = $('#pin-form'); f.pin.focus({ preventScroll: true }); } },
      focus: 'none',
    };
  }

  function waitingScreen(t, p) {
    const intro = HUNT.intro ? '<section class="section section--intro"><p class="label">Before you begin</p><p class="text">' + esc(HUNT.intro) + '</p></section>' : '';
    const countHtml = t2 => { const n = S.players(t2).length; return 'Waiting for the MC to start the hunt. <b>' + n + '</b>&nbsp;' + (n === 1 ? 'player has' : 'players have') + ' joined so far.'; };
    return {
      key: 'waiting:' + p.id,
      html: () => appbar(t, p) +
        '<section class="section section--waiting"><p class="label label--gilt">You’re in</p><h1 class="h-display">' + esc(p.name) + '</h1>' + membersLine(p) +
        '<p class="text" id="wait-count">' + countHtml(t) + '</p></section>' +
        wallHtml(0, '<p class="wall-after">Tonight you’ll write it, one phrase at a time.</p>') + intro +
        '<p class="center-note">Keep this page open. Your first clue will appear here.</p>' + switchLink() + demoNote(),
      update() { $('#wait-count').innerHTML = countHtml(S.tree); },
    };
  }

  // Clue: the riddle, plus only what the MC has released for this clue (live).
  const HELP_KINDS = [['hint1', 'Hint'], ['hint2', 'Stronger hint'], ['kids', 'Little ones']];
  // `live`: the MC released something while this clue was on screen. If it lands out of sight (the riddle is
  // long), bring it into view, unless they are typing a code.
  function syncReleases(rel, live) {
    const openSlot = $('#open-slot'), relSlot = $('#rel-slot');
    if (!openSlot || !relSlot) return;
    let added = null;
    // Opened: hiding spot + code, between the wall and the clue.
    const o = rel.open && rel.open.code ? rel.open : null;
    const sig = o ? o.code + '\n' + (o.hide || '') : '';
    if (openSlot.dataset.sig !== sig) {
      openSlot.dataset.sig = sig;
      openSlot.innerHTML = o
        ? '<section class="notice fade-in" aria-labelledby="open-h"><p class="label" id="open-h">Opened by the MC</p>' +
          (o.hide ? '<p>The card for this clue was hidden here: ' + tx(o.hide) + '</p>' : '<p>The MC opened this clue for you.</p>') +
          '<p class="code" aria-label="Code ' + esc(o.code.split('').join(' ')) + '">' + esc(o.code) + '</p>' +
          '<button class="btn btn--primary" type="button" data-act="use" data-code="' + esc(o.code) + '">Use this code</button></section>'
        : '';
      if (o) added = openSlot.firstElementChild;
    }
    // Hints and the little-ones line, under the riddle, always in the same order.
    let note = relSlot.querySelector('.notice');
    const any = HELP_KINDS.some(([k]) => rel[k] != null && rel[k] !== '');
    if (!any) { if (note) note.remove(); }
    else {
      if (!note) {
        relSlot.innerHTML = '<section class="notice notice--inset" aria-labelledby="rel-h"><p class="label" id="rel-h">Released by the MC</p></section>';
        note = relSlot.querySelector('.notice');
      }
      HELP_KINDS.forEach(([k, label], i) => {
        let item = note.querySelector('[data-kind="' + k + '"]');
        const text = rel[k] == null ? '' : smart(rel[k]);
        if (!text) { if (item) item.remove(); return; }
        if (item) { const tp = item.lastElementChild; if (tp.textContent !== text) tp.innerHTML = tx(rel[k]); return; }
        item = document.createElement('div');
        item.className = 'notice-item fade-in';
        item.dataset.kind = k;
        item.innerHTML = '<p class="label">' + label + '</p><p>' + tx(rel[k]) + '</p>';
        const later = HELP_KINDS.slice(i + 1).map(([k2]) => note.querySelector('[data-kind="' + k2 + '"]')).find(Boolean);
        note.insertBefore(item, later || null);
        added = added || item;
      });
    }
    const typing = document.activeElement && document.activeElement.matches && document.activeElement.matches('input, textarea');
    if (live && added && !typing) {
      const r = added.getBoundingClientRect();
      if (r.top < 0 || r.bottom > window.innerHeight) added.scrollIntoView({ block: 'nearest' });
    }
  }
  function clueScreen(t, p, prog, riddle) {
    // The MC has shared clue 1's key but it doesn't open here: this page holds an older hunt file than the
    // MC's (the hunt was resealed after it was opened). Reloading fetches the new one.
    const stale = prog.n === 1 && !riddle && !!S.startKey(t);
    const riddleHtml = riddle
      ? '<p class="riddle">' + tx(riddle) + '</p>'
      : stale
        ? '<p class="riddle-wait">This page is out of date, so clue 1 can’t open here. Reload the page to get it. If it still doesn’t open, ask the MC.</p>' +
          '<button class="btn btn--primary btn--block" type="button" data-act="reload">Reload</button>'
        : '<p class="riddle-wait">' + (prog.n === 1 ? 'Waiting for the MC to share the first clue. It will appear here in a moment.' : 'This clue didn’t open. Ask the MC for help.') + '</p>';
    return {
      key: 'clue:' + p.id + ':' + prog.n + ':' + (riddle ? 1 : stale ? 'stale' : 0),
      html: () => appbar(t, p) + wallHtml(prog.written) +
        '<div id="open-slot" aria-live="polite"></div>' +
        '<section class="clue" aria-labelledby="clue-h"><h1 class="label" id="clue-h">Clue ' + prog.n + ' of ' + N + '</h1>' + riddleHtml +
        '<div id="rel-slot" aria-live="polite"></div></section>' +
        '<section class="entry" aria-label="Enter a card code"><p class="entry-lead"><b>Found the card?</b> Scan it with your camera, or type its code.</p>' +
        '<form class="pair" id="code-form" novalidate><input class="field field--code" name="code" placeholder="CODE" maxlength="8" autocomplete="off" autocapitalize="characters" autocorrect="off" spellcheck="false" enterkeyhint="go" aria-label="Card code" aria-describedby="code-fb">' +
        '<button class="btn btn--primary" type="submit">Open</button></form><p class="feedback" id="code-fb" aria-live="polite"></p></section>' +
        switchLink() + demoNote(),
      mount() { syncReleases(S.releaseFor(t, prog.n)); },
      update() { $('#place').innerHTML = placeHtml(S.tree, me()); syncReleases(S.releaseFor(S.tree, prog.n), true); },
    };
  }

  // Station: painting, the phrase just written, story, scriptures, ponder, then the group task.
  function articleHtml(e, label) {
    return '<article class="station"><p class="label">' + label + '</p><h1 class="h-page">' + tx(e.title) + '</h1>' +
      (e.story ? '<p class="story">' + tx(e.story) + '</p>' : '') + scripturesHtml(e.scriptures) +
      (e.ponder ? '<aside class="ponder"><p class="label">Ponder</p><p>' + tx(e.ponder) + '</p></aside>' : '') + '</article>';
  }
  const TASK_KIND = { order: 'Put in order', word: 'Fill the blank', together: 'Together', gifts: 'Gifts' };
  const TASK_TITLE = { order: 'Put the words in order', word: 'Find the missing word', together: 'Before you go on', gifts: 'Gifts for Him' };
  const NEXT_NOTE = { order: 'Opens when the words are in order', word: 'Opens when you answer together', together: 'Opens when you’re done', gifts: 'Opens when you’ve added your gifts' };
  // Prompts may mark the missing word with a run of underscores; draw it as a blank.
  const promptHtml = text => tx(text).replace(/_{3,}/g, '<span class="blank" aria-label="blank"></span>');
  function taskHtml(c, p, done) {
    const type = TASK_KIND[c.type] ? c.type : 'together';
    let body = '';
    if (done) body = '<p class="task-done">' + (type === 'gifts' ? 'He will treasure them.' : 'Done. Your verse has its next words.') + '</p>' +
      (type === 'gifts' && p.gifts.length ? giftsList(p.gifts) : '');
    else if (type === 'order') {
      body = '<p class="built" id="built" aria-live="polite"></p><div class="tiles" id="tiles"></div><p class="task-status" id="task-status"></p><p class="feedback" id="task-fb" aria-live="polite"></p>';
    } else if (type === 'word') {
      const numeral = (c.answers || []).some(a => /\d/.test(a));
      body = '<form class="pair" id="word-form" novalidate><input class="field" name="answer" placeholder="Your answer" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="done" aria-label="Your answer" aria-describedby="task-fb">' +
        '<button class="btn btn--primary" type="submit">Check</button></form>' + (numeral ? '<p class="help">Any spelling is fine. Numbers work too.</p>' : '') +
        '<p class="feedback" id="task-fb" aria-live="polite"></p>';
    } else if (type === 'gifts') {
      body = '<form class="pair" id="gift-form" novalidate><input class="field" name="gift" placeholder="My gift to Him…" maxlength="80" autocomplete="off" enterkeyhint="enter" aria-label="Your gift">' +
        '<button class="btn btn--primary" type="submit">Add</button></form><p class="feedback" id="task-fb" aria-live="polite"></p>' +
        '<ul class="gifts" id="gift-list"></ul><button class="btn btn--secondary btn--block" type="button" id="gifts-done" disabled>We’ve added our gifts</button>';
    } else {
      body = '<button class="btn btn--secondary btn--block" type="button" id="together-btn">' + tx(c.button || 'We did it') + '</button>';
    }
    return '<section class="task" aria-labelledby="task-h"><div class="task-head"><span class="label label--gilt">Together</span><span class="label">' + TASK_KIND[type] + '</span></div>' +
      '<h2 class="h-task" id="task-h">' + tx(c.title || TASK_TITLE[type]) + '</h2>' + (c.prompt ? '<p class="prompt" id="task-prompt">' + promptHtml(c.prompt) + '</p>' : '') +
      '<div class="task-body" id="task-body">' + body + '</div></section>';
  }
  function stationScreen(t, p, e) {
    const solved = p.solved.indexOf(e.code) >= 0;
    const last = e.n >= N;
    const c = e.challenge && e.challenge.type ? e.challenge : null;
    const type = c && TASK_KIND[c.type] ? c.type : 'together';
    return {
      key: 'station:' + p.id + ':' + e.code,
      html: () => plateHtml(e.art) +
        earnedHtml(e.n, 'Added to your verse', ticksHtml(i => (i < e.n - 1 ? 'on' : i === e.n - 1 ? 'now' : ''))) +
        articleHtml(e, 'Station ' + e.n) + (c ? taskHtml(c, p, solved) : '') +
        '<div class="next"><button class="btn btn--primary btn--block" type="button" id="next-btn" data-act="next"' + (c && !solved ? ' disabled aria-describedby="next-note"' : '') + '>' +
        (last ? 'Finish' : 'Show the next clue') + '</button>' + (c && !solved ? '<p class="next-note" id="next-note">' + NEXT_NOTE[type] + '</p>' : '') + '</div>' + demoNote(),
      mount() {
        station = { code: e.code, done: solved || !c };
        if (!c) { if (!solved) { holdCode = e.code; settle(S.solveCard(myId, e, N)); } return; }
        if (!solved) mountTask(c, e);
      },
      update() {
        const p2 = me();
        if (station && station.code === e.code && !station.done && station.drawGifts) station.drawGifts();   // teammates' gifts, live
        // A teammate finished this task on another phone: show it done instead of leaving them stuck.
        if (station && station.code === e.code && !station.done && p2 && p2.solved.indexOf(e.code) >= 0) {
          station.done = true; holdCode = e.code;
          const body = $('#task-body');
          const inTask = !!body && body.contains(document.activeElement);   // typing the answer, on a tile…
          if (body) body.innerHTML = '<p class="task-done">Your team finished this on another phone.</p>' + (type === 'gifts' && p2.gifts.length ? giftsList(p2.gifts) : '');
          enableNext(inTask);
        }
      },
    };
  }
  // Open the next button. The task's controls are gone, so if focus went with them, it moves to the button
  // (a screen reader would otherwise be dropped at the top of the page). `fromTask`: focus was in the task.
  // When a teammate finishes on another phone, a player reading the story (focus on the page itself) stays put.
  function enableNext(fromTask) {
    const btn = $('#next-btn'), note = $('#next-note');
    if (btn) { btn.disabled = false; btn.removeAttribute('aria-describedby'); }
    if (note) note.remove();
    const a = document.activeElement;
    if (btn && fromTask && (!a || a === document.body || !a.isConnected || a.disabled)) {
      btn.focus({ preventScroll: true });
      if (btn.getBoundingClientRect().bottom > window.innerHeight) btn.scrollIntoView({ block: 'nearest' });
    }
  }
  // The task's success line, in a live region so screen readers announce it (filled a moment after it is added).
  function doneNote(after, text) {
    const el = document.createElement('p');
    el.className = 'task-done';
    el.setAttribute('role', 'status');
    after.after(el);
    setTimeout(() => { el.textContent = text; }, 60);
  }
  // The group task is done: write the phrase, keep the station on screen, and open the next button.
  function taskDone(e) {
    if (!station || station.code !== e.code || station.done) return;
    station.done = true;
    holdCode = e.code;
    settle(S.solveCard(myId, e, N));
    enableNext(true);
  }
  function shuffled(items) {
    const a = items.map((t, i) => ({ t, i }));
    for (let tries = 0; tries < 12; tries++) {
      for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
      if (a.length < 2 || a.some((x, k) => x.i !== k)) break;
    }
    return a;
  }
  function mountTask(c, e) {
    const fb = $('#task-fb');
    if (c.type === 'order') {
      const items = (c.items || []).map(String);
      let placed = 0;
      const built = $('#built'), tiles = $('#tiles'), status = $('#task-status');
      const draw = () => {
        const left = items.length - placed;
        let slots = '';
        for (let k = 0; k < Math.min(left, 3); k++) slots += '<span class="slot' + (k === 0 ? ' now' : '') + '" aria-hidden="true"></span>';
        built.innerHTML = esc(items.slice(0, placed).join(' ')) + (placed && left ? ' ' : '') + slots;
        status.textContent = placed + ' of ' + items.length + ' in place';
      };
      tiles.innerHTML = shuffled(items).map(x => '<button class="tile" type="button">' + esc(x.t) + '</button>').join('');
      draw();
      tiles.addEventListener('click', ev => {
        const tile = ev.target.closest('.tile');
        if (!tile || placed >= items.length || refuseTask(fb)) return;
        if (tile.textContent === items[placed]) {
          tile.remove(); placed++; setFb(fb, '', '');
          draw();
          if (placed === items.length) {
            built.classList.add('is-done'); tiles.remove();
            setFb(fb, 'good', 'That’s it.');
            taskDone(e);
          } else {
            const next = tiles.querySelector('.tile');
            if (next && document.activeElement === document.body) next.focus({ preventScroll: true });
          }
        } else {
          tile.classList.add('is-wrong');
          setTimeout(() => tile.classList.remove('is-wrong'), 1200);
          setFb(fb, 'bad', 'Not that one yet. Look at the scripture above.');
        }
      });
    } else if (c.type === 'word') {
      const form = $('#word-form');
      const clean = s => String(s || '').toLowerCase().replace(/[^a-z0-9]/g, '');
      // The verse the blank quotes, when the prompt names it right after the quotation ("…thy ____ …" (Genesis 28:14)).
      // It is often not among the scriptures on the screen, so a wrong answer points there instead.
      const quoted = (String(c.prompt || '').match(/_{3,}[^"“”]*["”]\s*\(([^()]*\d+:\d+[^()]*)\)/) || [])[1];
      const wrong = quoted ? 'Not quite. Look it up in ' + quoted.trim().replace(/ /g, ' ') + '.' : 'Not quite. The scriptures above can help.';
      form.answer.addEventListener('input', () => form.answer.removeAttribute('aria-invalid'));
      form.addEventListener('submit', ev => {
        ev.preventDefault();
        if (refuseTask(fb)) return;
        const raw = form.answer.value.trim(), guess = clean(raw);
        if (!guess) { setFb(fb, 'bad', 'Type your answer first.'); form.answer.focus(); return; }
        if ((c.answers || []).some(a => clean(a) === guess)) {
          form.answer.disabled = true; form.answer.removeAttribute('aria-invalid');
          const btn = form.querySelector('button'); if (btn) btn.remove();
          const blank = $('#task-prompt .blank');
          if (blank) { blank.textContent = String((c.answers || [])[0] || raw); blank.classList.add('is-filled'); blank.removeAttribute('aria-label'); }
          setFb(fb, 'good', 'Yes.');
          taskDone(e);
        } else {
          form.answer.setAttribute('aria-invalid', 'true');
          setFb(fb, 'bad', wrong);
        }
      });
    } else if (c.type === 'gifts') {
      const form = $('#gift-form'), list = $('#gift-list'), fin = $('#gifts-done');
      // The list is the player's gifts in the game, so gifts a teammate adds on another phone appear here too.
      const mine = () => { const p = me(); return p ? p.gifts : []; };
      const draw = () => {
        const html = mine().map(g => '<li>' + esc(g) + '</li>').join('');
        if (list.innerHTML !== html) list.innerHTML = html;
        fin.disabled = !mine().length;
      };
      station.drawGifts = draw;
      draw();
      form.addEventListener('submit', ev => {
        ev.preventDefault();
        if (refuseTask(fb)) return;
        const g = form.gift.value.trim().replace(/\s+/g, ' ').slice(0, 80);
        if (!g) { setFb(fb, 'bad', 'Write a gift first.'); form.gift.focus(); return; }
        settle(S.addGift ? S.addGift(myId, g) : S.setGifts(myId, mine().concat(g)));
        form.gift.value = '';
        setFb(fb, '', '');
        draw();
      });
      fin.addEventListener('click', () => {
        if (!mine().length || refuseTask(fb)) return;
        station.drawGifts = null;
        doneNote(fin, 'He will treasure them.');
        form.remove(); fin.remove(); fb.remove();
        taskDone(e);
      });
    } else {
      const btn = $('#together-btn');
      btn.addEventListener('click', () => {
        if (refuseTask($('#task-fb'))) return;
        doneNote(btn, 'Thank you.');
        btn.remove();
        taskDone(e);
      });
    }
  }

  // Recap: an earlier card, scanned again.
  function recapScreen(t, p, e, k) {
    return {
      key: 'recap:' + k,
      html: () => backbar(t, p, backLabel(t, p)) + plateHtml(e.art) +
        earnedHtml(e.n, 'Already in your verse', ticksHtml(i => (i === e.n - 1 ? 'now' : i < p.solved.length ? 'on' : ''))) +
        articleHtml(e, 'Station ' + e.n + ' · already found') +
        '<div class="next"><button class="btn btn--primary btn--block" type="button" data-act="back">' + esc(backLabel(t, p)) + '</button></div>' + demoNote(),
      update() { $('#place').innerHTML = placeHtml(S.tree, me()); },
    };
  }

  // Message: decoy, not yet, almost, check the code, not started.
  function messageScreen(t, p, v) {
    const label = backLabel(t, p);
    return {
      key: 'message:' + v.seq,
      html: () => backbar(t, p, label) +
        '<section class="section section--message"><p class="label' + (v.tone === 'decoy' ? ' label--error' : '') + '">' + esc(v.label) + '</p>' +
        '<h1 class="h-page">' + tx(v.title) + '</h1>' + (v.text ? '<p class="text">' + tx(v.text) + '</p>' : '') +
        (v.scripture && v.scripture.text ? scriptureHtml({ text: v.scripture.text, ref: v.scripture.ref || '', bom: !!v.scripture.bom }) : '') + '</section>' +
        '<div class="actions"><button class="btn btn--primary btn--block" type="button" data-act="' + (v.act || 'back') + '"' + (v.code ? ' data-code="' + esc(v.code) + '"' : '') + '>' +
        esc(v.button || label) + '</button></div>' + demoNote(),
      update() { const el = $('#place'); if (el) el.innerHTML = placeHtml(S.tree, me()); },
    };
  }
  function checkingScreen(t, p) {
    return {
      key: 'checking',
      html: () => (p ? appbar(t, p) : '') +
        '<section class="section section--message" aria-busy="true"><p class="label">Card scanned</p><h1 class="h-page">Checking the card…</h1></section>',
    };
  }

  // Finished: the last painting, the whole verse, the place and the gifts.
  function doneScreen(t, p, e) {
    const finale = (e && e.finale) || (H.hunt && H.hunt.finale) || {};   // sealed in the last card's entry
    const giftsBlock = p2 => (p2.gifts.length ? '<p class="label">Your gifts for Him</p>' + giftsList(p2.gifts) : '');
    const verse = PHRASES.map((ph, i) => '<span class="' + phCls(ph, i === N - 1 ? 'is-newest' : '') + '">' + esc(ph) + '</span>').join(' ');
    return {
      key: 'done:' + p.id,
      html: () => (e ? plateHtml(e.art) : '') +
        '<section class="finale" aria-labelledby="fin-h"><div class="finale-head"><span class="label label--gilt" id="fin-place">You finished ' + ordinal(S.place(t, p.id)) + '</span>' +
        '<span class="label">' + N + ' of ' + N + '</span></div>' +
        '<h1 class="h-page" id="fin-h">' + tx(finale.heading || 'Glory to God in the highest') + '</h1>' +
        '<div class="finale-verse"><div class="wall-head"><span class="label label--gilt">' + esc(REF) + '</span><span class="label">Written by ' + esc(p.name) + '</span></div>' +
        '<p class="wall-verse wall-verse--finale">' + verse + '</p>' + ticksHtml(i => (i === N - 1 ? 'now' : 'on')) + '</div>' +
        '<p class="text">' + tx(finale.text || 'Your verse is complete. Wait here for the others, then read Luke 2 together.') + '</p>' +
        scripturesHtml([{ ref: 'Luke 2:11', bom: false, text: 'For unto you is born this day in the city of David a Saviour, which is Christ the Lord.' }]) +
        '<div class="finale-gifts" id="fin-gifts"' + (p.gifts.length ? '' : ' hidden') + '>' + giftsBlock(p) + '</div></section>' +
        switchLink() + demoNote(),
      update() {
        const p2 = me(); if (!p2) return;
        $('#fin-place').textContent = 'You finished ' + ordinal(S.place(S.tree, p2.id));
        const box = $('#fin-gifts'), html = giftsBlock(p2);
        if (box.innerHTML !== html) box.innerHTML = html;
        box.hidden = !p2.gifts.length;
      },
    };
  }

  // ---------- the end of the hunt ----------
  // The TV reveals the places one at a time (tv.html: the verse, then each place, 1st held longer). The phones
  // show the places only once the TV has shown them all, so nobody reads them on a phone first.
  const REVEAL_MS = { verse: 12000, place: 6000, first: 9000 };
  const TOP = 4;
  let rvSeen, rvTimer = 0;   // rvSeen: { at, local } for the reveal this phone has seen (undefined before the first tree)
  function revealDone(t) {
    const at = isEnded(t) ? revealAt(t) : null;
    if (!at) { rvSeen = null; return false; }
    if (!rvSeen || rvSeen.at !== at) {
      // Pressed while this page is open: time it from now. Already pressed when the page opened: catch up.
      rvSeen = { at, local: rvSeen === undefined ? Math.min(Date.now(), at) : Date.now() };
    }
    const k = Math.min(TOP, finalStandings(t).length);
    const left = rvSeen.local + REVEAL_MS.verse + Math.max(0, k - 1) * REVEAL_MS.place + REVEAL_MS.first - Date.now();
    if (left <= 0) return true;
    clearTimeout(rvTimer);
    rvTimer = setTimeout(render, left + 50);
    return false;
  }
  const resultLine = e => (e.finishedAt ? 'At the manger' : solvedCount(e) + ' of ' + N + ' written');
  function placeRow(e, me, place) {
    const team = e.team && e.members && e.members.length ? e.members.join(', ') : '';
    return '<li' + (me ? ' class="is-me"' : '') + '><span class="ord' + (place === 1 ? ' is-first' : '') + '">' + ordinal(place) + '</span>' +
      '<span class="who"><span class="nm">' + esc(e.name) + (me ? '<span class="you">You</span>' : '') + '</span>' +
      (team ? '<span class="members">' + esc(team) + '</span>' : '') + '</span><span class="st">' + resultLine(e) + '</span></li>';
  }
  // The hunt has ended: look at the TV. Before the reveal: this player's own place and verse. After it: the same top
  // places as the TV, plus this player's own place if it isn't among them.
  function endedScreen(t, p, revealed) {
    const all = finalStandings(t);
    const idx = all.findIndex(e => (e.id ? e.id === p.id : e.name === p.name));
    const mine = idx >= 0 ? all[idx] : null, myPlace = mine ? (+mine.place || idx + 1) : 0;
    const written = Math.min(N, p.solved.length);
    const early = !!(metaOf(t).ended || {}).early;
    const giftsBlock = p.gifts.length ? '<div class="finale-gifts ended-gifts"><p class="label">Your gifts for Him</p>' + giftsList(p.gifts) + '</div>' : '';
    let body;
    if (!revealed) {
      const line = !mine ? '' : p.finishedAt || mine.finishedAt ? 'You reached the manger.' : 'When the hunt ended, you had written ' + written + ' of ' + N + ' phrases.';
      body = '<section class="section section--ended"><p class="label">The hunt has ended</p><h1 class="h-display">Look at the TV</h1>' +
        '<p class="text">' + (revealAt(t) ? 'The places are being shown on the TV now.' : 'Gather around. The MC will share the places there.') + '</p></section>' +
        (myPlace ? '<section class="result" aria-labelledby="res-h"><div class="result-head"><span class="label" id="res-h">Your place</span><span class="label">' + written + ' of ' + N + ' written</span></div>' +
          '<p class="result-place' + (myPlace === 1 ? ' is-first' : '') + '">' + ordinal(myPlace) + '</p>' + (line ? '<p class="result-line">' + line + '</p>' : '') + '</section>' : '') +
        wallHtml(written, '', true) + giftsBlock;
    } else {
      const top = all.slice(0, TOP);
      const rows = top.map((e, i) => placeRow(e, i === idx, i + 1)).join('') +
        (mine && idx >= TOP ? '<li class="places-gap" aria-hidden="true">·&nbsp;·&nbsp;·</li>' + placeRow(mine, true, myPlace) : '');
      body = '<section class="section section--ended"><p class="label label--gilt">Tonight’s places</p><h1 class="h-display">' +
        (early ? 'Who came closest to the manger' : 'Who reached the manger first') + '</h1>' +
        (early ? '<p class="text">The hunt ended early, so the places follow how far each team had come.</p>' : '') + '</section>' +
        (rows ? '<ol class="places">' + rows + '</ol>' : '') +
        wallHtml(written, '', true) +
        '<div class="ended-verse">' + scripturesHtml([{ ref: 'Luke 2:11', bom: false, text: 'For unto you is born this day in the city of David a Saviour, which is Christ the Lord.' }]) + '</div>' +
        giftsBlock;
    }
    return {
      // Drawn again only when what it shows changes (places don't move once the hunt has ended).
      key: 'ended:' + p.id + ':' + (revealed ? 'places' : revealAt(t) ? 'showing' : 'gather') + ':' + myPlace + ':' + written + ':' + p.gifts.length + ':' + all.length,
      html: () => appbar(t, p) + body + switchLink() + demoNote(),
    };
  }

  // ---------- choosing and drawing the screen ----------
  function pick(t, p) {
    if (view) {
      if (view.kind === 'register') return registerScreen(view);
      if (view.kind === 'pin') { const x = S.player(t, view.id); if (x && !p) return pinScreen(x); view = null; }
      else if (view.kind === 'message') return messageScreen(t, p, view);
      else if (view.kind === 'recap' && p) return recapScreen(t, p, view.entry, view.seq);
      else if (view.kind === 'checking') return checkingScreen(t, p);
      else view = null;
    }
    if (!p) return welcomeScreen(t);
    if (isEnded(t)) return endedScreen(t, p, revealDone(t));
    if (!S.started(t)) return waitingScreen(t, p);
    const prog = S.progress(p, N);
    if (holdCode) {
      const e = entryFor(holdCode);
      if (e === undefined) return null;
      if (e) return stationScreen(t, p, e);
      holdCode = null;
    }
    if (prog.stage === 'station') {
      const e = entryFor(prog.code);
      if (e === undefined) return null;
      return e && e.kind === 'station' ? stationScreen(t, p, e) : problemScreen('stale');
    }
    if (prog.stage === 'done') {
      const lastCode = p.found[N - 1];
      const e = lastCode ? entryFor(lastCode) : null;
      if (e === undefined) return null;
      return doneScreen(t, p, e);
    }
    const riddle = riddleFor(t, prog);
    if (riddle === undefined) return null;
    return clueScreen(t, p, prog, riddle);
  }

  function show(scr) {
    if (scr.key === cur.key) { if (scr.update) scr.update(); return; }
    cur = { key: scr.key };
    if (!scr.key.startsWith('station:')) station = null;
    if (barWatch) { barWatch.disconnect(); barWatch = null; }
    app.className = scr.cls || '';
    app.innerHTML = scr.html();
    void app.offsetWidth;            // restart the one quiet fade
    app.classList.add('fade-in');
    window.scrollTo(0, 0);
    if (scr.mount) scr.mount();
    if (scr.focus !== 'none') {
      const h = app.querySelector('h1');
      if (h) { h.setAttribute('tabindex', '-1'); h.focus({ preventScroll: true }); }
    }
  }

  // While the MC has the hunt paused, the code entry, the task and "Show the next clue" are held (disabled, with a
  // note saying why); the screen itself stays as it is, so a half-done task is still there on resume. Only the
  // controls this hold disabled are let go again.
  const HOLD = '#code-form input, #code-form button, #open-slot button, #task-body button, #task-body input, #next-btn';
  function holdControls(on) {
    if (!on) {
      app.querySelectorAll('[data-held]').forEach(el => { el.disabled = false; el.removeAttribute('data-held'); });
      app.querySelectorAll('.paused-note').forEach(el => el.remove());
      return;
    }
    app.querySelectorAll(HOLD).forEach(el => { if (!el.disabled) { el.disabled = true; el.setAttribute('data-held', ''); } });
    const boxes = [$('.entry'), $('.task') || $('.next')].filter(Boolean);
    boxes.forEach(box => { if (!box.querySelector('.paused-note')) box.insertAdjacentHTML('beforeend', '<p class="paused-note">' + PAUSED_MSG + '</p>'); });
  }

  function render() {
    updateOffline();
    const tNow = S && S.tree, paused = !!tNow && !isEnded(tNow) && isPaused(tNow);
    pausedBar.hidden = !paused;
    if (!paused) holdControls(false);           // before the screen updates, so its own logic decides what is enabled
    if (!S || !H || !HUNT) return show(problemScreen('no-hunt'));
    if (fatal) return show(problemScreen(fatal.code === 'insecure-context' || fatal.code === 'no-hunt' ? fatal.code : 'other'));
    const t = S.tree;
    if (!t || S.loaded === false) return show(loadingScreen());
    hadTree = true;
    let p = me();
    // Removed by the MC (or a new game): sign this phone out.
    if (myId && !p && !(view && view.kind === 'register' && view.saving)) {
      writeMe(null); holdCode = null;
      if (view && view.kind !== 'register' && view.kind !== 'pin') view = null;
    }
    p = me();
    if (p && !S.started(t)) holdCode = null;
    if (holdCode && (!p || p.found.indexOf(holdCode) < 0)) holdCode = null;
    // A teammate finished the task on screen from another phone: stay on the station so it can say so.
    if (p && !view && !holdCode && station && !station.done && cur.key === 'station:' + p.id + ':' + station.code &&
        p.solved.indexOf(station.code) >= 0) holdCode = station.code;
    revealDone(t);                              // keeps track of the reveal, whatever is on screen
    const scr = pick(t, p);
    if (scr) show(scr);
    else if (!cur.key) show(loadingScreen());
    if (paused) holdControls(true);
    // A card scanned before signing in (or while the page was loading) is used now.
    if (p && pending && !busy && !(view && (view.kind === 'register' || view.kind === 'pin'))) {
      const code = pending; setPending(null);
      handleCode(code, 'link');
    }
  }

  // ---------- screens over the flow, and the phone's back gesture ----------
  // Register, PIN, messages and recap open over the flow. Opening one adds a history entry, so the back gesture
  // (Android back, iOS swipe) closes it instead of leaving the hunt; the on-screen Back goes back the same way.
  const overlayEntry = () => !!(history.state && history.state.ov);
  let afterPop = null;   // what leaveOverlay() does once its history entry is gone
  function overlay(v) {
    view = v;
    if (!overlayEntry()) { try { history.pushState({ ov: 1 }, ''); } catch (e) { /* the screen still opens */ } }
    render();
  }
  function closeOverlay() {
    if (afterPop) return;                 // already on its way out
    if (overlayEntry()) history.back();   // popstate closes it
    else { view = null; render(); }
  }
  // Leave an overlay without the Back button (signed in or up; a card moved them on from a message): take its
  // history entry away too, or the next back gesture would do nothing. `then` runs once the entry is gone, so
  // a screen it opens (a card scanned before signing in) gets an entry of its own.
  function leaveOverlay(then) {
    if (afterPop) { afterPop = then; return; }
    if (overlayEntry()) { afterPop = then; history.back(); }
    else then();
  }
  window.addEventListener('popstate', () => {
    if (afterPop) { const then = afterPop; afterPop = null; then(); return; }
    if (!overlayEntry() && view && view.kind !== 'checking' && !view.saving) { view = null; render(); }
  });
  // Reloaded on such a screen: the history entry is kept but the screen isn't, so start from a plain entry.
  if (overlayEntry()) { try { history.replaceState(null, ''); } catch (e) { /* harmless */ } }

  // ---------- cards ----------
  function showMessage(v) { overlay(Object.assign({ kind: 'message', seq: ++seq }, v)); }
  const NOT_STARTED = { label: 'Not started', title: 'The hunt hasn’t started yet', text: 'Put the card back where you found it. Your first clue appears here when the MC starts the hunt.', button: 'OK' };
  // Is a newer build deployed than the one this page loaded? Then a code this page doesn't know may be a card
  // from a resealed hunt (new codes after a rehearsal), and reloading opens it. False when it can't tell.
  function newerBuild() {
    const ask = fetch('version.js?t=' + Date.now(), { cache: 'no-store' })
      .then(r => (r.ok ? r.text() : ''))
      .then(s => { const m = /STAR_HUNT_BUILD\s*=\s*['"]([^'"]+)['"]/.exec(s); return !!(m && window.STAR_HUNT_BUILD && m[1] !== window.STAR_HUNT_BUILD); })
      .catch(() => false);
    return Promise.race([ask, new Promise(res => setTimeout(() => res(false), 4000))]);
  }

  // A code tried while the hunt is paused or over: nothing is opened or saved. Typed: say so under the field (the
  // code stays in it, to open after the pause). Scanned: a message, since the card's link leaves no field to keep it in.
  function refuseCode(form, fb, source) {
    const ended = isEnded(S.tree);
    if (ended && !view && cur.key && cur.key.indexOf('ended:') === 0) return;   // the ended screen already says so
    if (form && form.isConnected && source !== 'link') { setFb(fb, '', ended ? ENDED_MSG : PAUSED_MSG); return; }
    showMessage(ended
      ? { label: 'The hunt has ended', title: 'The hunt has ended', text: 'Look at the TV. The MC will share the places there.', button: 'OK' }
      : { label: 'Paused', title: 'The hunt is paused', text: 'Please wait for the MC. Scan this card again once the hunt goes on.', button: 'OK' });
  }

  async function handleCode(raw, source) {
    const code = H ? H.normCode(raw) : '';
    const form = $('#code-form'), fb = $('#code-fb');
    if (!code) {
      if (form) { setFb(fb, 'bad', 'Type the code printed under the card.'); form.code.focus(); }
      return;
    }
    const t = S.tree, p = me();
    if (!t || !p) {            // keep it until they sign in (the welcome screen says so)
      setPending(code);
      if (t && view && view.kind !== 'register' && view.kind !== 'pin') view = null;
      if (t) render();
      return;
    }
    if (!S.started(t)) return showMessage(NOT_STARTED);
    if (blockedMsg(t)) return refuseCode(form, fb, source);
    if (busy) return;
    busy = code;
    const btn = form && form.querySelector('button');
    let slow = null;
    if (form) {
      form.code.value = code; form.code.removeAttribute('aria-invalid');
      btn.disabled = true; btn.setAttribute('aria-busy', 'true');
      setFb(fb, 'busy', 'Checking…');
    } else {
      slow = setTimeout(() => { if (busy === code) { view = { kind: 'checking' }; render(); } }, 160);
    }
    let entry, outdated = false;
    try { entry = await H.openCard(code); }
    catch (err) { busy = null; clearTimeout(slow); fatal = err; if (view && view.kind === 'checking') view = null; render(); return; }
    if (!entry) outdated = await newerBuild();
    busy = null; clearTimeout(slow);
    if (view && view.kind === 'checking') view = null;
    if (form && form.isConnected) { btn.disabled = false; btn.removeAttribute('aria-busy'); setFb(fb, '', ''); }
    const now = me();
    if (!now) { render(); return; }
    if (!S.started(S.tree)) return showMessage(NOT_STARTED);
    if (blockedMsg(S.tree)) { render(); return refuseCode($('#code-form'), $('#code-fb'), source); }   // paused or ended while checking
    if (entry) entries.set(entry.code, entry);
    switch (S.cardStatus(now, entry)) {
      case 'unknown':
        if (outdated) {
          return showMessage({ label: 'Check the code', title: 'This page is out of date', text: 'The hunt was updated after this page was opened. Reload it to open this card.',
            button: 'Reload', act: 'reload', code });
        }
        if (form && form.isConnected && source !== 'link') {
          form.code.setAttribute('aria-invalid', 'true');
          setFb(fb, 'bad', 'That code isn’t a card in this hunt. Check the letters.');
          return;
        }
        return showMessage({ label: 'Check the code', title: 'That isn’t one of our cards', text: 'Check the letters printed under the card, then type them in or scan it again.' });
      case 'decoy': {
        const d = HUNT.decoyMessage || {};
        return showMessage({ tone: 'decoy', label: 'Herod’s decoy', title: d.title || 'A false star!', text: d.text || 'Put this card back where you found it, and follow your true clue.',
          scripture: d.scripture });
      }
      case 'next':
        holdCode = null;
        settle(S.findCard(myId, entry));        // the screen moves to the station at once
        if (!entry.challenge) { holdCode = entry.code; settle(S.solveCard(myId, entry, N)); }
        leaveOverlay(() => { view = null; render(); });
        return;
      case 'almost': {
        const prog = S.progress(now, N);
        let title = '';
        try { const at = prog.code ? await H.openCard(prog.code) : null; title = at && at.title ? at.title : ''; } catch (e) { /* the message still makes sense */ }
        return showMessage({ label: 'Almost', title: 'Finish this station first',
          text: 'This is the card you’re looking for, but the task at ' + (title ? '“' + title + '”' : 'your station') + ' isn’t done yet. Finish it together, then scan this card again.' });
      }
      case 'current':
        leaveOverlay(() => { view = null; render(); }); return;
      case 'recap':
        overlay({ kind: 'recap', entry, seq: ++seq }); return;
      default: {   // notyet: refuse without giving anything away
        const lines = HUNT.notYet && HUNT.notYet.length ? HUNT.notYet : ['Not yet. This part of the verse is still to come.'];
        return showMessage({ label: 'Not yet', title: lines[Math.floor(Math.random() * lines.length)], text: 'Put this card back where you found it, and keep following your clue.' });
      }
    }
  }

  function readHash() {
    const params = new URLSearchParams(location.hash.slice(1));
    const code = params.get('s');
    if (code == null) return;
    history.replaceState(history.state, '', location.pathname + location.search);
    if (!S || !S.tree || !me()) { setPending(H ? H.normCode(code) : code); if (S && S.tree) render(); return; }
    handleCode(code, 'link');
  }

  // ---------- sign in and sign up ----------
  function pinLock() {
    try { const v = JSON.parse(sget(storage('localStorage'), LOCK_KEY) || '{}'); return { fails: +v.fails || 0, until: +v.until || 0 }; } catch (e) { return { fails: 0, until: 0 }; }
  }
  // Five wrong PINs lock the PIN form on this phone for 30 seconds (kept across reloads and tabs).
  function savePinLock(v) { sset(storage('localStorage'), LOCK_KEY, v ? JSON.stringify(v) : null); }
  function lockPinForm(until) {
    const form = $('#pin-form'), fb = $('#pin-fb');
    if (!form) return;
    form.pin.disabled = true; form.querySelector('button').disabled = true;
    setFb(fb, 'bad', 'Too many tries. Wait a moment, then try again.');
    setTimeout(() => {
      if (!form.isConnected) return;
      form.pin.disabled = false; form.querySelector('button').disabled = false;
      setFb(fb, '', ''); form.pin.value = ''; form.pin.focus();
    }, Math.max(0, until - Date.now()));
  }
  async function signIn(form) {
    const fb = $('#pin-fb');
    const lock = pinLock();
    if (lock.until > Date.now()) { lockPinForm(lock.until); return; }
    const x = view && view.kind === 'pin' ? S.player(S.tree, view.id) : null;
    if (!x) { view = null; render(); return; }
    const pin = form.pin.value.replace(/\D/g, '');
    if (pin.length !== 4) { form.pin.setAttribute('aria-invalid', 'true'); setFb(fb, 'bad', 'Your PIN is 4 numbers.'); form.pin.focus(); return; }
    const btn = form.querySelector('button');
    btn.disabled = true; btn.setAttribute('aria-busy', 'true');
    const ok = await S.checkPin(x, pin);
    if (ok) {
      savePinLock(null);
      leaveOverlay(() => { writeMe(x.id); view = null; holdCode = null; render(); });
      return;
    }
    btn.disabled = false; btn.removeAttribute('aria-busy');
    const fails = lock.fails + 1;
    form.pin.value = '';
    form.pin.setAttribute('aria-invalid', 'true');
    if (fails >= 5) { const until = Date.now() + 30000; savePinLock({ fails: 0, until }); lockPinForm(until); return; }
    savePinLock({ fails, until: 0 });
    setFb(fb, 'bad', 'That PIN isn’t right.');
    form.pin.focus();
  }
  async function register(form) {
    const fb = $('#reg-fb');
    if (view.saving) return;
    const team = !!view.team;
    const name = form.name.value.trim().replace(/\s+/g, ' ');
    const pin = form.pin.value.replace(/\D/g, '');
    const members = team ? form.members.value.split(',').map(m => m.trim().replace(/\s+/g, ' ')).filter(Boolean)
      .filter((m, i, a) => a.findIndex(o => o.toLowerCase() === m.toLowerCase()) === i).slice(0, 20) : [];
    [form.name, form.pin].forEach(f => f.removeAttribute('aria-invalid'));
    const bad = (field, msg) => { field.setAttribute('aria-invalid', 'true'); setFb(fb, 'bad', msg); field.focus(); };
    if (!name) return bad(form.name, team ? 'Give your team a name.' : 'Please enter your name.');
    if (S.players(S.tree).some(x => x.name.trim().replace(/\s+/g, ' ').toLowerCase() === name.toLowerCase())) {
      return bad(form.name, 'Someone already has that name. Try another.');
    }
    if (!/^\d{4}$/.test(pin)) return bad(form.pin, 'Choose 4 digits for your PIN.');
    const id = S.uid();
    view.saving = true;
    form.querySelector('button[type=submit]').disabled = true;
    writeMe(id);
    const saving = Promise.resolve(S.addPlayer({ id, name, team, members, pin })).catch(() => {});
    // The local tree has the player as soon as the PIN is hashed; don't wait for a slow network.
    await Promise.race([saving, new Promise(res => { const chk = () => (S.player(S.tree, id) ? res() : setTimeout(chk, 25)); chk(); })]);
    leaveOverlay(() => { view = null; holdCode = null; render(); });
  }
  function signOut() {
    writeMe(null); view = null; holdCode = null; station = null;
    render();
  }

  // ---------- events ----------
  app.addEventListener('click', ev => {
    const el = ev.target.closest('[data-act]');
    if (!el || el.disabled) return;
    const act = el.dataset.act;
    if (act === 'back') closeOverlay();
    else if (act === 'next') {
      if (blockedMsg(S.tree)) { render(); return; }   // held while paused (a tap that beat the screen)
      // A solve that never reached the server (the Wi-Fi dropped, and the refresh after it took the solve back)
      // is saved again, so the button always moves on to the next clue.
      const p = me(), code = holdCode || (station && station.done ? station.code : null);
      const e = code ? entries.get(code) || (H && H.peekCard ? H.peekCard(code) : null) : null;
      if (p && e && e.kind === 'station' && p.found.indexOf(code) >= 0 && p.solved.indexOf(code) < 0) settle(S.solveCard(myId, e, N));
      holdCode = null; view = null; render();
    }
    else if (act === 'pick') overlay({ kind: 'pin', id: el.dataset.id });
    else if (act === 'register') overlay({ kind: 'register', team: el.dataset.team === '1' });
    else if (act === 'use') {
      const form = $('#code-form');
      if (form) form.code.value = el.dataset.code;
      handleCode(el.dataset.code, 'use');
    }
    else if (act === 'switch') signOut();
    else if (act === 'reload') {
      // The card is used again after the reload (stored only: this page must not use it in the meantime).
      if (el.dataset.code) sset(storage('sessionStorage'), PENDING_KEY, el.dataset.code);
      location.reload();
    }
  });
  app.addEventListener('submit', ev => {
    const form = ev.target;
    ev.preventDefault();
    if (form.id === 'code-form') handleCode(form.code.value, 'typed');
    else if (form.id === 'pin-form') signIn(form);
    else if (form.id === 'reg-form') register(form);
  });
  app.addEventListener('input', ev => {
    const f = ev.target;
    if (f.classList && f.classList.contains('field--pin')) { const v = f.value.replace(/\D/g, '').slice(0, 4); if (v !== f.value) f.value = v; }
    if (f.name === 'code' && f.getAttribute('aria-invalid')) { f.removeAttribute('aria-invalid'); setFb($('#code-fb'), '', ''); }
    if (f.getAttribute && f.getAttribute('aria-invalid') && f.name !== 'answer') f.removeAttribute('aria-invalid');
  });
  window.addEventListener('hashchange', readHash);

  // ---------- connection ----------
  // A save that failed (or is slow) waits in the store's outbox and is sent again until it goes through
  // (S.pending counts them): say so for as long as it waits, and drop "Couldn't save" once it has gone through.
  let lastPending = 0;
  function updateOffline() {
    if (!S) return;
    const down = !DEMO && (!S.connected || navigator.onLine === false);
    const waiting = DEMO ? 0 : (+S.pending || 0);
    if (lastPending > 0 && !waiting) saveErrorUntil = 0;
    lastPending = waiting;
    let text = '';
    if (down && (hadTree || Date.now() - bootAt > 4000)) text = 'Reconnecting…';
    else if (waiting) text = 'Saving… waiting for the connection.';
    else if (Date.now() < saveErrorUntil) text = 'Couldn’t save. Check your connection.';
    offlineBar.hidden = !text;
    if (text && offlineBar.textContent !== text) offlineBar.textContent = text;
  }
  window.addEventListener('star-store-error', () => { saveErrorUntil = Date.now() + 8000; updateOffline(); setTimeout(updateOffline, 8100); });
  window.addEventListener('online', updateOffline);
  window.addEventListener('offline', updateOffline);
  setTimeout(render, 4100);   // show "Reconnecting…" / "Still connecting…" if the first load is slow
  setTimeout(render, 6100);

  if (S) S.subscribe(() => render());
  render();
  readHash();
})();
</script>
</body>
</html>
